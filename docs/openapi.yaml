openapi: 3.0.3
info:
  title: Agent API & Memory Backend
  version: 1.0.0
  description: >-
    HTTP API of the go-monolith backend. Every route except `/healthz`,
    `/metrics` and the two routes the trading bot calls (`/oracle/evaluate` and
    `/oracle/ping`) is called on behalf of a user named by the `X-User-ID`
    header (a UUID; the user is created on first use). There is no user token:
    the server listens on 127.0.0.1 unless `LISTEN_ADDR` says otherwise. The
    two bot routes take no `X-User-ID`; they need the bearer token
    `ORACLE_TOKEN` instead.


    Errors of the plain routes are `text/plain` messages. Not found is always
    404, also for something that belongs to another user, so the API does not
    reveal which ids exist.


    The Flet client keeps a copy of this file in its own `docs/openapi.yaml`;
    change both together.
servers:
- url: http://localhost:8080
  description: Default LISTEN_ADDR is 127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: Health check
      description: Pings the database.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '503':
          description: The database does not answer
          content:
            text/plain:
              schema:
                type: string
                example: Service Unavailable
  /metrics:
    get:
      summary: Prometheus metrics
      description: Unauthenticated; keep the server on loopback or behind a firewall.
      responses:
        '200':
          description: OK
  /messages:
    post:
      summary: Create a new message
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - role
              - content
              properties:
                session_id:
                  type: string
                  maxLength: 128
                role:
                  type: string
                  enum: [user, assistant, system]
                content:
                  type: string
                  description: Not blank, at most 32000 bytes.
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: Get messages for a session
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: session_id
        in: query
        required: false
        description: >-
          Session whose messages should be returned. When it is omitted the most
          recent messages the user owns are returned instead, across sessions,
          so a client that lost the id of its last conversation can still
          restore history. Every message carries its own session_id.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: >-
          Maximum number of messages to return, ordered by the newest first
          before the response reverses them. Defaults to 50, capped at 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: >-
            List of messages, oldest first, so the array can be rendered as a
            transcript from top to bottom. An answer that used documents or
            memories carries them in `sources`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /memories:
    post:
      summary: Create a new memory
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              - importance
              properties:
                content:
                  type: string
                  description: Not blank, at most 32000 bytes.
                status:
                  type: string
                  enum: [candidate, active, superseded]
                  default: candidate
                source_message_id:
                  type: string
                  nullable: true
                  format: uuid
                importance:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 1 = trivia, 10 = critical.
                metadata:
                  type: object
                  nullable: true
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '409':
          description: A memory with the same content exists; it is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: Get the memories of a user
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: status
        in: query
        required: false
        description: Only memories in this status.
        schema:
          type: string
          enum: [candidate, active, superseded]
      responses:
        '200':
          description: List of memories (blank ones are left out)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /memories/{id}:
    put:
      summary: Update a memory
      description: >-
        `metadata` is kept as it is when the request does not send it, so an
        edit of the text does not lose fields such as `fact_key`.
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              - status
              - importance
              properties:
                content:
                  type: string
                status:
                  type: string
                  enum: [candidate, active, superseded]
                importance:
                  type: integer
                  minimum: 1
                  maximum: 10
                metadata:
                  type: object
                  nullable: true
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Another memory of the user already has this content
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a memory
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Memory deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/files:
    description: >-
      Files are served under `/v1/files` and, because the chat clients call the
      unprefixed paths, under `/files` as well. Both prefixes behave
      identically (the `/files...` paths below are references to these).
    post:
      summary: Upload a file
      description: >-
        The file is stored and an ingest job is queued; the answer does not wait
        for it. The size limit is 100 MB (`MAX_UPLOAD_MB`). Any file is
        accepted here: the format is judged by the ingest job (MIME type sniffed
        from the first bytes, or the file extension), and a file it cannot read
        ends in status `failed`.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '409':
          description: A file with the same hash already exists; it is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          description: Not a multipart form, no `file` part, or an empty file
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The file is larger than the upload limit (`file too large`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: Get all files for a user
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: >-
            List of files with chunk_count, has_embeddings and embedding_status
            so clients can show whether each file is usable for retrieval.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestedFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /files:
    $ref: '#/paths/~1v1~1files'
  /v1/files/{id}:
    get:
      summary: Get a single file with its embedding status
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: File metadata including chunk_count and embedding_status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a file
      description: >-
        A soft delete: the file no longer shows in lists or in search (and the
        same file can be uploaded again), but its row, its chunks and the stored
        original are kept, so a mistake can be undone.
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: File deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{id}:
    $ref: '#/paths/~1v1~1files~1%7Bid%7D'
  /v1/files/{id}/category:
    patch:
      summary: Override the category of a file
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - category
              properties:
                category:
                  $ref: '#/components/schemas/FileCategory'
      responses:
        '200':
          description: Updated file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          description: Invalid id, or a category that is not in the list
          content:
            text/plain:
              schema:
                type: string
                example: 'category must be one of: medicine, economics, programming, law, psychology, literature, philosophy, self_help, history, general'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{id}/category:
    $ref: '#/paths/~1v1~1files~1%7Bid%7D~1category'
  /chat/stream:
    post:
      summary: Stream chat messages
      description: >-
        Stores the user message, answers with a Server-Sent Events stream and
        stores the finished answer. Frames, in the order they arrive:


        * `event: sources` - first: a JSON array of `SourceInfo` (the
          documents and memories in the prompt; `[]` when none);

        * `event: sources` - again, only when the model looked into the
          documents with a tool while it answered: the passages it found
          (`source_type` `text` or `ocr`, no `score`), only the ones not in an
          earlier frame. It comes as soon as the text based on them starts, or
          at the end. A client adds these to the sources it has; the stored
          answer lists all of them;

        * `data: {"reasoning_content": "..."}` - the model's reasoning, only when
          `LLM_ENABLE_THINKING` is on (clients normally hide it);

        * `data: {"content": "..."}` - pieces of the answer, with `<think>`
          blocks and tool-call markup already removed;

        * `event: proposals` - once, before the end, only when the model asked
          to save a global rule: a JSON array of `Proposal`. The rule is not
          saved until the user decides (`/proposals/{id}/approve`). (A memory
          the model decides to keep is saved at once and is not announced.);

        * `data: [DONE]` - the end of a good answer;

        * `event: error` with `{"error": "..."}` - the generation failed; no
          `[DONE]` follows and the answer is not stored. The message carries a
          `request_id` to find the details in the log.


        Failures before the first frame are ordinary HTTP errors. A question
        that got no answer stays in the history; `/chat/regenerate` answers it.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - content
              properties:
                session_id:
                  type: string
                content:
                  type: string
                  description: At most 4000 tokens (estimated).
      responses:
        '200':
          description: Stream of events
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: sources
                data: [{"chunk_id":"…","file_name":"book.pdf","content_snippet":"…","score":0.152,"score_type":"distance","source_type":"concept"}]

                event: sources
                data: [{"chunk_id":"…","file_name":"book.pdf","content_snippet":"…","score":0,"source_type":"text"}]

                data: {"content":"The Danube "}

                data: {"content":"is the border."}

                data: [DONE]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /chat/regenerate:
    post:
      summary: Regenerate the last answer of a session
      description: >-
        Answers the last user message of the session again, with the same
        stream as `/chat/stream` (see there for the frames). The previous
        answer is left out of the prompt, and replaced only when the new one is
        complete; if the generation fails the old answer stays.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
      responses:
        '200':
          description: Stream of events, as for `/chat/stream`
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: No `session_id`, or the session has no user message to answer
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
  /proposals:
    get:
      summary: Proposals that wait for the user
      description: >-
        A global rule the model asked to save is kept here until the user
        approves or rejects it (a rule is the first thing in the system prompt of
        every session, so it is never written without a decision). A proposal
        that nobody answers expires after 14 days. Memories are not proposals:
        the model saves them itself.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Open proposals of the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /proposals/{id}/approve:
    post:
      summary: Apply a proposal
      description: >-
        Saves what the proposal describes - in practice a global rule.
      parameters:
      - $ref: '#/components/parameters/ProposalId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The proposal, now `approved`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The proposal has been decided already
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: >-
            The user has 20 global rules already. The proposal stays open;
            delete a rule (`DELETE /rules/{id}`) and approve again.
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /proposals/{id}/reject:
    post:
      summary: Drop a proposal
      parameters:
      - $ref: '#/components/parameters/ProposalId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The proposal, now `rejected`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The proposal has been decided already
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /rules:
    get:
      summary: Global rules of the user
      description: >-
        Rules are placed first in the system prompt of every session. They are
        created only by approving a proposal, never directly.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The rules, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /rules/{id}:
    delete:
      summary: Delete a global rule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Rule deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /oracle/evaluate:
    post:
      summary: Second opinion on a trading signal (called by the trading bot)
      description: >-
        The trading bot sends one signal of its strategy with the numbers
        around it and a few cleaned news headlines; the model answers
        `APPROVE`, `VETO` or `HOLD` with a short reason in Bulgarian. The model
        has no tools, no memory and no access to the database, and the news is
        quoted to it as data.


        The route is not served at all unless `ORACLE_TOKEN` is set to at
        least 32 characters. Asking again about the same `signal_id` returns the
        earlier verdict with `cached: true`: a `HOLD` for 3 minutes, an
        `APPROVE` or `VETO` for 30. A call that finds the same signal already on
        its way to the model waits for that answer. Every answered or failed
        call is written to the journal (`GET /oracle/decisions`).


        Any status other than 200 carries no verdict: the caller must treat it
        as a `HOLD`, never as a yes.
      security:
      - OracleBearer: []
      requestBody:
        required: true
        description: At most 64 KB. Fields this API does not know are ignored.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OracleRequest'
      responses:
        '200':
          description: The verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleResult'
        '400':
          description: The body is not usable; `detail` names the field, never its content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '401':
          description: Missing or wrong token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer realm="oracle"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '413':
          description: The body is over 64 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '500':
          description: A fault on the server side (the cause is in the log)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '502':
          description: >-
            The model did not answer (`model_unavailable`) or answered twice
            with something that is not a verdict (`unusable_reply`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '504':
          description: The model did not answer in time (`model_timeout`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
  /oracle/ping:
    get:
      summary: Is the Oracle route on, and is the token right?
      description: >-
        For the bot's `doctor` and `health` checks. It does not call the model.
      security:
      - OracleBearer: []
      responses:
        '200':
          description: The route is on and the token is accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          description: Missing or wrong token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
  /oracle/decisions:
    get:
      summary: The journal of the Oracle
      description: >-
        Every question the bot asked and what the model answered (or why it
        did not), newest first. In shadow mode, when the bot ignores the
        verdicts, this is the whole result. The journal belongs to the system,
        not to a user. The request bodies are left out of the list.
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: before_id
        in: query
        description: The `next_before_id` of the previous page; 0 or absent starts at the newest.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: symbol
        in: query
        description: Only this symbol (upper case).
        schema:
          type: string
      responses:
        '200':
          description: A page of the journal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleDecisionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    OracleBearer:
      type: http
      scheme: bearer
      description: The value of `ORACLE_TOKEN` (at least 32 characters). Only the trading bot has it.
  parameters:
    UserId:
      name: X-User-ID
      in: header
      required: true
      description: >-
        The user. A missing header is 401; a value that is not a UUID is 400.
      schema:
        type: string
        format: uuid
    MemoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: Bad request (a malformed id or body, or a value out of range)
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: The `X-User-ID` header is missing
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: >-
        There is no such item for this user. The same answer is given for an id
        that belongs to someone else.
      content:
        text/plain:
          schema:
            type: string
    MethodNotAllowed:
      description: Method not allowed
    PayloadTooLarge:
      description: The request body is larger than 1 MiB
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Internal server error (the cause is in the server log)
  schemas:
    OracleRequest:
      type: object
      required: [schema_version, signal]
      properties:
        schema_version:
          type: integer
          enum: [1]
        mode:
          type: string
          enum: ['', shadow, active]
          description: >-
            What the bot does with the verdict. Only kept in the journal; the
            model is not told.
        signal:
          $ref: '#/components/schemas/OracleSignal'
        rationale:
          type: string
          description: Why the strategy produced the signal.
        technicals:
          type: object
          additionalProperties: true
          description: Indicators of the last closed bar; shown to the model as they come, sorted by name.
        recent_bars:
          type: array
          description: The latest closed bars, oldest first (the newest 24 are kept).
          items:
            type: object
            additionalProperties: true
        volume_ratio:
          description: Volume of the last bar against its norm.
          oneOf:
          - type: number
          - type: string
        live_price:
          oneOf:
          - type: number
          - type: string
        context:
          type: object
          additionalProperties: true
          description: The account and the risk limits.
        news:
          type: array
          description: Newest first; at most 5 are kept.
          items:
            $ref: '#/components/schemas/OracleNewsItem'
    OracleSignal:
      type: object
      required: [signal_id, symbol, direction]
      properties:
        signal_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
        symbol:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9./-]{0,14}$'
        direction:
          type: string
          enum: [LONG, SHORT, FLAT]
        timeframe:
          type: string
        version:
          type: string
        closed_bar_timestamp:
          type: string
        expires_at:
          type: string
        confidence:
          type: number
    OracleNewsItem:
      type: object
      description: >-
        One article, already cleaned by the bot; it is cleaned and cut again
        here (headline 160 characters, summary 300, one line, no addresses or
        markup).
      properties:
        article_id:
          description: For the journal; the model does not see it.
        published_at:
          type: string
        source:
          type: string
        headline:
          type: string
        summary:
          type: string
        other_symbols:
          type: integer
          minimum: 0
          description: How many other stocks the article names.
    OracleResult:
      type: object
      required: [verdict, reason, request_id, model, cached, latency_ms]
      properties:
        verdict:
          type: string
          enum: [APPROVE, VETO, HOLD]
        reason:
          type: string
          description: One short sentence in Bulgarian (at most 200 characters).
        request_id:
          type: string
          description: The `X-Request-ID` of this call, to find it in the log.
        model:
          type: string
        cached:
          type: boolean
          description: The verdict was given a moment ago for the same signal.
        latency_ms:
          type: integer
          format: int64
          description: 0 for a cached verdict.
        prompt_version:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: >-
            A label of the question the model was asked: the first 12 hex characters
            of a SHA-256 over the system prompt as rendered, the JSON schema of the
            answer, the call settings of the Oracle (temperature, token limit, number
            of attempts, limit on the reason) and the layout of the facts. A change to
            any of them gives the next answers a new label, which is how a changed
            prompt is told apart afterwards (the bot's evaluation starts a new period
            then). For a cached verdict it is the label of the call that produced it.
            Not part of the label: the model (the `model` field), the model server's
            own settings (context size, default sampling) and anything the LLM client
            adds around the request. Additive: it is absent from the six required
            fields, so a client that does not know it keeps working.
    OracleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [unauthorized, invalid_request, unreadable_body, body_too_large, method_not_allowed, model_unavailable, model_timeout, unusable_reply, internal_error]
        detail:
          type: string
          description: Only on `invalid_request`.
    OracleEvaluation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        request_id:
          type: string
        signal_id:
          type: string
        symbol:
          type: string
        mode:
          type: string
        status:
          type: string
          enum: [answered, failed]
        verdict:
          type: string
          enum: [APPROVE, VETO, HOLD]
          description: Absent when the status is `failed`.
        reason:
          type: string
        model:
          type: string
        attempts:
          type: integer
          description: How many times the model was asked (1 or 2).
        finish_reason:
          type: string
          description: '`length` means the reply was cut off at the token limit.'
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        latency_ms:
          type: integer
        error:
          type: string
          description: Only when the status is `failed`.
        prompt_version:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: >-
            The label of the question the model was asked (see `OracleResult`);
            also set on a failed row, with the question it would have asked.
            Absent when it was not recorded: the rows from before it existed
            (migration 00026), and a call that failed before the prompt was rendered.
        signal_version:
          type: string
          description: >-
            The version of the strategy that made the signal, as the bot sent it
            (`signal.version` of the request body). `oracle-probe` marks the bot's
            own test questions, which are not signals. Read from the stored request
            by the database; absent when the request did not say.
    OracleDecisionList:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/OracleEvaluation'
        next_before_id:
          type: integer
          format: int64
          description: The `before_id` of the next page; 0 when this was the last one.
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        sources:
          type: array
          description: >-
            Only on answers that used documents or memories: what they were
            based on, as it was shown while streaming.
          items:
            $ref: '#/components/schemas/SourceInfo'
    SourceInfo:
      type: object
      properties:
        chunk_id:
          type: string
          format: uuid
        file_name:
          type: string
        page_number:
          type: integer
        content_snippet:
          type: string
        score:
          type: number
          format: double
          description: >-
            Measured as `score_type` says; 0 when there is no `score_type`. For
            `distance` it is the cosine distance between the question and the
            source - smaller is closer, and the summaries that are close enough to
            be used are at 0.10-0.17. It is not a percentage: with the embedding
            model in use even unrelated texts are at 0.15-0.30.
        score_type:
          type: string
          description: >-
            How `score` is measured. `distance` for a book summary or passage;
            `rrf` (0-100) only on answers stored long ago; absent on a recalled
            memory and on a passage the model found with a tool, which have no
            measure.
          enum: [rrf, distance]
        source_type:
          type: string
          enum: [text, ocr, concept, memory]
    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
        status:
          type: string
          enum: [candidate, active, superseded]
        source_message_id:
          type: string
          format: uuid
          nullable: true
        importance:
          type: integer
          minimum: 1
          maximum: 10
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    FileCategory:
      type: string
      enum:
        - medicine
        - economics
        - programming
        - law
        - psychology
        - literature
        - philosophy
        - self_help
        - history
        - general
    IngestedFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
        status:
          type: string
          description: State of the ingest job.
          enum: [pending, processing, completed, failed]
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        category:
          $ref: '#/components/schemas/FileCategory'
        manual_override:
          type: boolean
          description: True when the category was set by the user, not chosen automatically.
        chunk_count:
          type: integer
          format: int64
          description: >-
            Number of embedded chunks stored for this file. Embeddings live in
            the document_chunks table (pgvector), not in an external vector
            store.
        has_embeddings:
          type: boolean
          description: True when at least one embedded chunk exists for the file.
        embedding_status:
          type: string
          description: >-
            Ingest status extended with the embedding state. `completed` means
            the file finished ingesting and has vectors, `empty` means it
            finished ingesting but produced no chunks, and `pending`,
            `processing` and `failed` mirror the ingest status.
          enum:
            - pending
            - processing
            - completed
            - failed
            - empty
    Proposal:
      type: object
      description: >-
        Something the model asked to save, waiting for the user. A rule
        (`save_global_rule`) has `key` and `value`. The `create_memory` kind,
        with `content` and `importance`, is what proposals made before the owner
        decided that memories are saved at once look like; none is created now,
        but a stored one can still be approved or rejected.
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [save_global_rule, create_memory]
        status:
          type: string
          enum: [pending, approved, rejected]
        session_id:
          type: string
        summary:
          type: string
          description: One line, ready to show to the user (in Bulgarian).
        key:
          type: string
          description: Rules only (at most 64 characters).
        value:
          type: string
          description: Rules only (at most 400 characters).
        content:
          type: string
          description: Memories only (at most 1000 characters).
        importance:
          type: integer
          minimum: 1
          maximum: 10
          description: Memories only.
        external_sources:
          type: array
          description: >-
            The tools whose results (web pages, documents) were read in the turn
            that made the proposal. The text may have come from there, so the
            user should check it; empty means only the conversation.
          items:
            type: string
        created_at:
          type: string
          format: date-time
    Rule:
      type: object
      properties:
        id:
          type: integer
        key:
          type: string
        value:
          type: string
        enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
