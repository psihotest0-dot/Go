openapi: 3.0.3
info:
  title: API API
  version: 1.0.0
servers:
- url: http://localhost:8080
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: OK
  /messages:
    post:
      summary: Create a new message
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - role
              - content
              properties:
                session_id:
                  type: string
                role:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
    get:
      summary: Get messages for a session
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      - name: session_id
        in: query
        required: false
        description: >-
          Session whose messages should be returned. When it is omitted the most
          recent messages the user owns are returned instead, across sessions,
          so a client that lost the id of its last conversation can still
          restore history. Every message carries its own session_id.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: >-
          Maximum number of messages to return, ordered by the newest first
          before the response reverses them. Defaults to 50, capped at 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: >-
            List of messages, oldest first, so the array can be rendered as a
            transcript from top to bottom.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
  /memories:
    post:
      summary: Create a new memory
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              properties:
                content:
                  type: string
                status:
                  type: string
                  default: candidate
                source_message_id:
                  type: string
                  nullable: true
                  format: uuid
                importance:
                  type: integer
                metadata:
                  type: object
                  nullable: true
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '409':
          description: Memory already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
    get:
      summary: Get all memories for a user
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
  /memories/{id}:
    put:
      summary: Update a memory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              - status
              - importance
              properties:
                content:
                  type: string
                status:
                  type: string
                importance:
                  type: integer
                metadata:
                  type: object
                  nullable: true
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
    delete:
      summary: Delete a memory
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Memory deleted
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
  /v1/files:
    description: >-
      Files are served under /v1/files and, because the bundled chat UI calls
      the unprefixed paths, under /files as well. Both prefixes behave
      identically.
    post:
      summary: Upload a file
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '409':
          description: File with same hash already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
    get:
      summary: Get all files for a user
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: >-
            List of files with chunk_count, has_embeddings and embedding_status
            so clients can show whether each file is usable for retrieval.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestedFile'
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
  /v1/files/{id}:
    get:
      summary: Get a single file with its embedding status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: File metadata including chunk_count and embedding_status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
    delete:
      summary: Delete a file
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: File deleted
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
  /v1/files/{id}/category:
    patch:
      summary: Override the category of a file
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - category
              properties:
                category:
                  type: string
      responses:
        '200':
          description: Updated file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
  /chat/stream:
    post:
      summary: Stream chat messages
      parameters:
      - name: X-User-ID
        in: header
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - content
              properties:
                session_id:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: Stream of responses
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '405':
          description: Method not allowed
        '500':
          description: Internal server error
components:
  schemas:
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
        role:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
        status:
          type: string
        embedding:
          type: array
          items:
            type: number
            format: float
        embedding_model:
          type: string
        source_message_id:
          type: string
          format: uuid
          nullable: true
        importance:
          type: integer
        metadata:
          type: object
          nullable: true
        content_hash:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    IngestedFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        file_name:
          type: string
        file_hash:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        status:
          type: string
        local_path:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        category:
          type: string
        manual_override:
          type: boolean
        chunk_count:
          type: integer
          format: int64
          description: >-
            Number of embedded chunks stored for this file. Embeddings live in
            the document_chunks table (pgvector), not in an external vector
            store.
        has_embeddings:
          type: boolean
          description: True when at least one embedded chunk exists for the file.
        embedding_status:
          type: string
          description: >-
            Ingest status extended with the embedding state. `completed` means
            the file finished ingesting and has vectors, `empty` means it
            finished ingesting but produced no chunks, and `pending`,
            `processing` and `failed` mirror the ingest status.
          enum:
            - pending
            - processing
            - completed
            - failed
            - empty
