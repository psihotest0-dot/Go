openapi: 3.0.3
info:
  title: Agent API & Memory Backend
  version: 1.0.0
  description: >-
    HTTP API of the go-monolith backend. Every route except `/healthz`,
    `/metrics` and the two routes the trading bot calls (`/oracle/evaluate` and
    `/oracle/ping`) is called on behalf of a user named by the `X-User-ID`
    header (a UUID; the user is created on first use). There is no user token:
    the server listens on 127.0.0.1 unless `LISTEN_ADDR` says otherwise. The
    two bot routes take no `X-User-ID`; they need the bearer token
    `ORACLE_TOKEN` instead.


    Errors of the plain routes are `text/plain` messages. Not found is always
    404, also for something that belongs to another user, so the API does not
    reveal which ids exist.


    The Flet client keeps a copy of this file in its own `docs/openapi.yaml`;
    change both together.
servers:
- url: http://localhost:8080
  description: Default LISTEN_ADDR is 127.0.0.1:8080
paths:
  /healthz:
    get:
      summary: Health check
      description: Pings the database.
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '503':
          description: The database does not answer
          content:
            text/plain:
              schema:
                type: string
                example: Service Unavailable
  /metrics:
    get:
      summary: Prometheus metrics
      description: Unauthenticated; keep the server on loopback or behind a firewall.
      responses:
        '200':
          description: OK
  /messages:
    post:
      summary: Create a new message
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - role
              - content
              properties:
                session_id:
                  type: string
                  maxLength: 128
                role:
                  type: string
                  enum: [user, assistant, system]
                content:
                  type: string
                  description: Not blank, at most 32000 bytes.
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: Get messages for a session
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: session_id
        in: query
        required: false
        description: >-
          Session whose messages should be returned. When it is omitted the most
          recent messages the user owns are returned instead, across sessions,
          so a client that lost the id of its last conversation can still
          restore history. Every message carries its own session_id.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: >-
          Maximum number of messages to return, ordered by the newest first
          before the response reverses them. Defaults to 50, capped at 200.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: before
        in: query
        required: false
        description: >-
          The `id` of the oldest message the client shows: the page is then the
          messages OLDER than it (the message itself is not in it), at most
          `limit` of them, oldest first. Ask again with the first message of the
          page to go further back; an empty list means there is nothing older.
          Messages stored in one instant are told apart by their ids, so no
          page repeats or skips one. Needs `session_id`.
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: >-
            List of messages, oldest first, so the array can be rendered as a
            transcript from top to bottom. An answer that used documents or
            memories carries them in `sources`.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: >-
            `before` names no message of this user in this session (a message of
            someone else, or of another session, is answered the same way)
          content:
            text/plain:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /memories:
    post:
      summary: Create a new memory
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              - importance
              properties:
                content:
                  type: string
                  description: Not blank, at most 32000 bytes.
                status:
                  type: string
                  enum: [candidate, active]
                  default: candidate
                source_message_id:
                  type: string
                  nullable: true
                  format: uuid
                importance:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 1 = trivia, 10 = critical.
                metadata:
                  type: object
                  nullable: true
      responses:
        '201':
          description: Memory created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '409':
          description: A memory with the same content exists; it is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: Get the memories of a user
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: status
        in: query
        required: false
        description: Only memories in this status.
        schema:
          type: string
          enum: [candidate, active]
      responses:
        '200':
          description: List of memories (blank ones are left out)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Memory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /memories/{id}:
    put:
      summary: Update a memory
      description: >-
        `metadata` is kept as it is when the request does not send it, so an
        edit of the text does not lose fields such as `fact_key`.
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - content
              - status
              - importance
              properties:
                content:
                  type: string
                status:
                  type: string
                  enum: [candidate, active]
                importance:
                  type: integer
                  minimum: 1
                  maximum: 10
                metadata:
                  type: object
                  nullable: true
      responses:
        '200':
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Memory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '409':
          description: Another memory of the user already has this content
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a memory
      parameters:
      - $ref: '#/components/parameters/MemoryId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Memory deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/bills:
    post:
      summary: Read a bill into a conversation
      description: >-
        The PDF of a bill or a picture of one (OCR for a scan) is read by the local model;
        the amount and the dates are kept only when the text holds them. The upload and the
        answer - what was read and the question whether to keep it - are written into the
        conversation; the person's "да" in the chat keeps the bill (with a reminder of its
        due day when the reminders are on). Served only when BILLS_ENABLED. At most 20 MB.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - session_id
              properties:
                file:
                  type: string
                  format: binary
                session_id:
                  type: string
      responses:
        '200':
          description: The answer, also written into the conversation
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
        '400':
          description: No file or no session_id
        '413':
          description: The file is over 20 MB
  /v1/files:
    description: >-
      Files are served under `/v1/files` and, because the chat clients call the
      unprefixed paths, under `/files` as well. Both prefixes behave
      identically (the `/files...` paths below are references to these).
    post:
      summary: Upload a file
      description: >-
        The file is stored and an ingest job is queued; the answer does not wait
        for it. The size limit is 100 MB (`MAX_UPLOAD_MB`). Any file is
        accepted here: the format is judged by the ingest job (MIME type sniffed
        from the first bytes, or the file extension), and a file it cannot read
        ends in status `failed`.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: File uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '409':
          description: A file with the same hash already exists; it is returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          description: Not a multipart form, no `file` part, or an empty file
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          description: The file is larger than the upload limit (`file too large`)
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: Get all files for a user
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: >-
            List of files with chunk_count, has_embeddings and embedding_status
            so clients can show whether each file is usable for retrieval.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IngestedFile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /files:
    $ref: '#/paths/~1v1~1files'
  /v1/files/{id}:
    get:
      summary: Get a single file with its embedding status
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: File metadata including chunk_count and embedding_status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Delete a file
      description: >-
        The file no longer shows in lists or in search, and the same file can be
        uploaded again. Its chunks (text, summaries and their vectors) and the
        stored original are deleted; the row stays, marked deleted, as a record.
        A delete cannot be undone through the API: upload the file again.
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: File deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{id}:
    $ref: '#/paths/~1v1~1files~1%7Bid%7D'
  /v1/files/{id}/category:
    patch:
      summary: Override the category of a file
      parameters:
      - $ref: '#/components/parameters/FileId'
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - category
              properties:
                category:
                  $ref: '#/components/schemas/FileCategory'
      responses:
        '200':
          description: Updated file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestedFile'
        '400':
          description: Invalid id, or a category that is not in the list
          content:
            text/plain:
              schema:
                type: string
                example: 'category must be one of: medicine, economics, programming, law, psychology, literature, philosophy, self_help, history, general'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
  /files/{id}/category:
    $ref: '#/paths/~1v1~1files~1%7Bid%7D~1category'
  /chat/stream:
    post:
      summary: Stream chat messages
      description: >-
        Stores the user message, answers with a Server-Sent Events stream and
        stores the finished answer. A conversation (a person and a `session_id`)
        has one reply at a time, whoever asked for it - this endpoint,
        `/chat/regenerate` or the Telegram bot: a request that finds the
        conversation busy waits for its turn, in the order requests came, and
        the wait counts in the time of the request (5 minutes). Nothing of it is
        stored until its turn comes. When the session is a conversation shared
        with a Telegram chat (`tg-<chat id>`, see `/telegram/sessions`), the bot
        repeats the question and the answer in that chat once the answer is
        complete; nothing in the response shows it. Frames, in the order they
        arrive:


        * `event: queued` with `{}` - only when the request has `queue_events`
          true and the conversation is busy: the request is waiting for another
          reply to end. Sent once, before every other frame; the status 200 goes
          out with it, so a failure after it comes as an `event: error` frame;

        * `event: sources` - first: a JSON array of `SourceInfo` (the
          documents and memories in the prompt; `[]` when none);

        * `event: sources` - again, only when the model looked into the
          documents with a tool while it answered: the passages it found
          (`source_type` `text` or `ocr`, no `score`), only the ones not in an
          earlier frame. It comes as soon as the text based on them starts, or
          at the end. A client adds these to the sources it has; the stored
          answer lists all of them;

        * `data: {"reasoning_content": "..."}` - the model's reasoning, only when
          `LLM_ENABLE_THINKING` is on (clients normally hide it);

        * `data: {"content": "..."}` - pieces of the answer, with `<think>`
          blocks and tool-call markup already removed;

        * `event: proposals` - once, before the end, only when the model asked
          to save a global rule: a JSON array of `Proposal`. The rule is not
          saved until the user decides (`/proposals/{id}/approve`). (A memory
          the model decides to keep is saved at once and is not announced.);

        * `event: model` - once, before the end, only while the paid provider is
          configured (`PAID_LLM_ENABLED`): who gave the answer, `{"provider":
          "local"}` or `{"provider": "deepseek", "model": "deepseek-flash"}`. A
          client can show it next to the answer; the history does not keep it;

        * `event: plan` - once, before the end, only when the request has
          `plan_events` true and the answer was planned from the person's
          memories and used some of them (`ANSWER_PLAN_ENABLED`):
          `{"remembered": ["...", "..."]}`, the start of each memory it used,
          for a line like "Лили си спомни: …" under the answer. The history
          keeps it as `remembered` on the message;

        * `data: [DONE]` - the end of a good answer; by then the answer is
          stored, so the history already has it;

        * `event: error` with `{"error": "..."}` - the generation failed; no
          `[DONE]` follows and the answer is not stored. The message carries a
          `request_id` to find the details in the log.


        Failures before the first frame are ordinary HTTP errors; when the
        conversation stays busy until the time of the request ends it is `503`
        and nothing is stored (with `queue_events` that is an `event: error`
        frame). A question that got no answer stays in the history;
        `/chat/regenerate` answers it.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              - content
              properties:
                session_id:
                  type: string
                content:
                  type: string
                  description: At most 4000 tokens (estimated).
                use_paid:
                  type: boolean
                  description: >-
                    The model for this turn: `true` - the paid one (the "cloud" button of the
                    client), `false` - the local one even for a question to the library, left
                    out - the default (the local model; questions to the library follow
                    `LIBRARY_LLM`). It does nothing while the paid provider is off
                    (`PAID_LLM_ENABLED`). If the paid model fails before it has done anything
                    (no limit left for the day, no network, a refusal) the local one answers
                    instead.
                queue_events:
                  type: boolean
                  description: >-
                    Ask to be told, with `event: queued`, that the request waits for another
                    reply in the same conversation. A client that does not know the frame must
                    not ask for it - it would take it for text. Left out: false.
                plan_events:
                  type: boolean
                  description: >-
                    Ask for `event: plan` with the memories a planned answer used. A client
                    that does not know the frame must not ask for it. Left out: false.
                mode:
                  type: string
                  enum: [books, web, library, files, memory, style, reminder]
                  description: >-
                    The button of the message: the turn must call a tool of this road -
                    `books` (search_documents, list_documents), `web` (web_search,
                    web_fetch), `library` (add_to_library; needs a link the person wrote),
                    `files` (Lili's own files), `memory` (create_memory, search_memories),
                    `style` (save_global_rule, save_style_note), `reminder` (no tool: the server reads the
                    request for a reminder itself and says its date back; off unless the reminders
                    are on). The answers the server gives
                    without the model (the help list, "успя ли?", the task over the added
                    documents) are not given in a mode; when the road is off, the server says
                    so in the text. For one message: the client clears it. Left out: none,
                    as before. Any other value: 400.
      responses:
        '200':
          description: Stream of events
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: sources
                data: [{"chunk_id":"…","file_name":"book.pdf","content_snippet":"…","score":0.152,"score_type":"distance","source_type":"concept"}]

                event: sources
                data: [{"chunk_id":"…","file_name":"book.pdf","content_snippet":"…","score":0,"source_type":"text"}]

                data: {"content":"The Danube "}

                data: {"content":"is the border."}

                data: [DONE]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The conversation stayed busy with another reply until the time of the request ended; nothing was stored
          content:
            text/plain:
              schema:
                type: string
  /chat/regenerate:
    post:
      summary: Regenerate the last answer of a session
      description: >-
        Answers the last user message of the session again, with the same
        stream as `/chat/stream` (see there for the frames). The answer stored
        after that message, read when the request starts, is left out of the
        prompt, and replaced only when the new one is complete; if the
        generation fails the old answer stays. A question without an answer (a
        failed turn) only gets one; the answers of earlier questions, and of a
        turn sent meanwhile, are never touched. When another regeneration has
        replaced the same answer first, this one is streamed but not stored.
        Like a new message it waits when the conversation is busy (see
        `/chat/stream`; `queue_events` and the `503` are the same).
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - session_id
              properties:
                session_id:
                  type: string
                use_paid:
                  type: boolean
                  description: >-
                    The model for this turn: `true` - the paid one (the "cloud" button of the
                    client), `false` - the local one even for a question to the library, left
                    out - the default (the local model; questions to the library follow
                    `LIBRARY_LLM`). It does nothing while the paid provider is off
                    (`PAID_LLM_ENABLED`). If the paid model fails before it has done anything
                    (no limit left for the day, no network, a refusal) the local one answers
                    instead.
                queue_events:
                  type: boolean
                  description: As for `/chat/stream`.
                plan_events:
                  type: boolean
                  description: As for `/chat/stream`.
      responses:
        '200':
          description: Stream of events, as for `/chat/stream`
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: No `session_id`, or the session has no user message to answer
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The conversation stayed busy with another reply until the time of the request ended
          content:
            text/plain:
              schema:
                type: string
  /chat/attachments:
    post:
      summary: Attach a text file to a conversation
      description: >-
        Attaches a file (code, a log, a long paste) to ONE conversation. It is not
        the library: nothing is split into passages, embedded or summarised, and
        other conversations never see it. The chat prompt shows the files that
        fit a budget of about 4 000 tokens (every line with its number), and the
        model looks into any file through its `read_attachment` tool (a part by
        line numbers, or the lines that contain a text). A name is one file per
        conversation: sending the same name again is a new version of it
        (`replaced`), the same content again changes nothing (`unchanged`).
        The text is stored with LF line breaks and without a byte order mark.
        Limits: 256 KB a file, 20 files and 1 MB a conversation; a file that was
        not attached again for 30 days is removed. The text the model reads from
        a file is untrusted: a memory it writes after that carries
        `external_sources: [attachments]`, and a global rule waits for the user.
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_id, name, content]
              properties:
                session_id:
                  type: string
                  description: The conversation (1 to 128 characters, no control characters).
                name:
                  type: string
                  description: The file name; only the last part of a path is kept (at most 120 characters).
                content:
                  type: string
                  description: The text of the file (UTF-8, not empty, no NUL byte).
      responses:
        '201':
          description: A new file in this conversation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAttachment'
        '200':
          description: The name was attached before - a new version, or the same content again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: The conversation already has 20 files or its files would be over 1 MB
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      summary: The files attached to a conversation
      description: >-
        Newest first, without the text.
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: session_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: The files (an empty list when there are none)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatAttachment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /chat/attachments/{id}:
    delete:
      summary: Remove an attached file
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspace/files:
    get:
      summary: The files the assistant keeps for the user
      description: >-
        The user's own text files - notes, lists, drafts the assistant writes down
        when asked (plan item P44). The routes exist only when the backend runs
        with `FILES_ENABLED=true`; otherwise they answer `404`, as an unknown
        path does. The folder is flat (no subfolders), one per user, and the
        assistant has no way to delete: that is `DELETE /workspace/files/{name}`,
        for the user. Only `.txt .md .csv .json .yaml .yml .log` files with plain
        names are listed. Limits: 64 KB a file, 200 files, 20 MB together with
        the previous versions.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The files by name and what they take
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFileList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspace/files/{name}:
    get:
      summary: The text of a file
      description: >-
        The whole text. `version=previous` is the text a replacement took the
        place of (one generation is kept); it has no size and no date. The text of
        a file may have been saved from a web page or a book: the assistant
        treats it as text from outside.
      parameters:
      - $ref: '#/components/parameters/UserFileName'
      - name: version
        in: query
        required: false
        schema:
          type: string
          enum: [current, previous]
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The text
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserFile'
        '400':
          description: The name is not a plain name with an allowed extension; the body says why
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      summary: Remove a file
      description: Removes the file and its previous version.
      parameters:
      - $ref: '#/components/parameters/UserFileName'
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Removed
        '400':
          description: The name is not a plain name with an allowed extension
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /workspace/files/{name}/library:
    post:
      summary: Put the text of a file into the library
      description: >-
        The second store: the text of the file becomes a document of the
        library, by the road of a document the server fetched itself (stored,
        refused when the library has the same text, queued for the ingest). The
        file stays in the folder, where it can still be changed or deleted; the
        copy in the library is not changed from here.
      parameters:
      - $ref: '#/components/parameters/UserFileName'
      - $ref: '#/components/parameters/UserId'
      responses:
        '201':
          description: Added; the ingest runs in the background
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAddResult'
        '200':
          description: The library has the same text already; nothing was added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryAddResult'
        '400':
          description: A bad name, or an empty file; the body says why
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: The file is larger than what the library takes
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: The library cannot be reached from the files
          content:
            text/plain:
              schema:
                type: string
  /proposals:
    get:
      summary: Proposals that wait for the user
      description: >-
        A global rule the model asked to save is kept here until the user
        approves or rejects it (a rule is the first thing in the system prompt of
        every session, so it is never written without a decision). A proposal
        that nobody answers expires after 14 days. Memories are not proposals:
        the model saves them itself.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Open proposals of the user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Proposal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /proposals/{id}/approve:
    post:
      summary: Apply a proposal
      description: >-
        Saves what the proposal describes - in practice a global rule.
      parameters:
      - $ref: '#/components/parameters/ProposalId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The proposal, now `approved`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The proposal has been decided already
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: >-
            The user has 20 global rules (or 8 notes on how to talk) already, or
            a file write cannot be done as it stands (the new file's name is
            taken, the file to change is gone, there is no room). The proposal
            stays open; the body says what is wrong. Delete one rule
            (`DELETE /rules/{id}`) and approve again, or reject the proposal.
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /proposals/{id}/reject:
    post:
      summary: Drop a proposal
      parameters:
      - $ref: '#/components/parameters/ProposalId'
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The proposal, now `rejected`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proposal'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The proposal has been decided already
          content:
            text/plain:
              schema:
                type: string
        '500':
          $ref: '#/components/responses/InternalError'
  /rules:
    get:
      summary: Global rules of the user
      description: >-
        Rules and notes on how to talk (`kind`) are in the system prompt of
        every session. They are created only by approving a proposal, never
        directly, and deleted the same way (`DELETE /rules/{id}`).
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The rules, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /rules/{id}:
    delete:
      summary: Delete a global rule
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Rule deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /chat/sessions/{id}:
    delete:
      summary: Delete a conversation for good
      description: |
        Removes the messages of one chat session, its rolling summary, the agent traces and
        the attached files, in one transaction. The user's memories are kept (they only lose
        the link to the message they came from). A user message that the background memory
        analysis has not read yet is not deleted at once: it is moved out of the session and
        removed after it has been read (within about five minutes), so a fact told just
        before the chat was deleted still becomes a memory. A session that does not exist is
        not an error (204). A chat turn still being generated in the session may write its
        answer after the deletion, so clients should not delete while one runs.
      parameters:
      - name: id
        in: path
        required: true
        description: The session id, 1 to 128 characters without control characters. Ids that
          start with `deleted:` are refused.
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Conversation deleted (or there was none)
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /telegram/sessions:
    get:
      summary: The Telegram conversations of the user
      description: |
        The Telegram chats tied to the user (`/link` in the bot) as conversations the app can
        open next to its own. The bot writes to the session `tg-<chat id>`, so opening that
        session in the app is one conversation in two places (one reply at a time, see
        `/chat/stream`). Named `Telegram`, then `Telegram 2` and so on in the order of the chat
        ids; the app adds the ones it lacks and keeps the names the user gave. A user with no
        Telegram link gets an empty list. A chat that was never `/link`ed has a user of its own
        and is not listed.
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: The conversations, possibly none
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramSessionList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /task-plan:
    get:
      summary: The plan of the task of a conversation
      description: |
        The newest plan of the conversation, whatever became of it (`active`, `done` or
        `cancelled`), or `{"plan": null}` when it has none. A plan exists only when the server runs
        with `TASK_PLAN_ENABLED=true` and the assistant made one for a task with several steps
        (`plan_set`); the assistant reports on the steps (`plan_update`), and the server checks
        that a step is `done` only after a successful call of the tool the step names. The app
        only shows it: nothing here changes a plan. What the tools did (the ledger) is not part of
        the answer; the line that says it is `evidence` of a done step.

        With `TASK_RUN_ENABLED=true` the plan may also be one the server walks itself (`kind` is
        set): "for each added source make a file with its key facts" is answered with the list of
        the documents and "да започна ли?", and after the person's yes the server makes one file a
        document in the background, each step's `ref` being the document and its `evidence` the
        file written. Such a plan is not returned before the yes. The newest plan of either kind
        is returned.
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: session_id
        in: query
        required: true
        description: The conversation (1 to 128 characters, no control characters).
        schema:
          type: string
      responses:
        '200':
          description: The plan, or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPlanResponse'
        '400':
          description: No usable `session_id`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /oracle/evaluate:
    post:
      summary: Second opinion on a trading signal (called by the trading bot)
      description: >-
        The trading bot sends one signal of its strategy with the numbers
        around it and a few cleaned news headlines; the model answers
        `APPROVE`, `VETO` or `HOLD` with a short reason in Bulgarian. The model
        has no tools, no memory and no access to the database, and the news is
        quoted to it as data.


        The route is not served at all unless `ORACLE_TOKEN` is set to at
        least 32 characters. Asking again about the same `signal_id` returns the
        earlier verdict with `cached: true`: a `HOLD` for 3 minutes, an
        `APPROVE` or `VETO` for 30. A call that finds the same signal already on
        its way to the model waits for that answer. Every answered or failed
        call is written to the journal (`GET /oracle/decisions`).


        The verdict belongs to the `signal_id`, not to the `mode`: the same signal
        asked in the other mode is answered from the first call (`cached: true`).
        Such a call leaves a light journal row of its own mode (`served_from`), so
        the journal shows a signal in every mode that asked about it; only one is
        written for a signal and a mode. The metrics carry the mode of the call
        (`oracle_requests_total`, `oracle_verdicts_total`, `oracle_latency_seconds`:
        `shadow`, `active`, or `none` when the body did not say or was refused).


        Any status other than 200 carries no verdict: the caller must treat it
        as a `HOLD`, never as a yes.
      security:
      - OracleBearer: []
      requestBody:
        required: true
        description: At most 64 KB. Fields this API does not know are ignored.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OracleRequest'
      responses:
        '200':
          description: The verdict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleResult'
        '400':
          description: The body is not usable; `detail` names the field, never its content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '401':
          description: Missing or wrong token
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer realm="oracle"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '413':
          description: The body is over 64 KB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '500':
          description: A fault on the server side (the cause is in the log)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '502':
          description: >-
            The model did not answer (`model_unavailable`) or answered twice
            with something that is not a verdict (`unusable_reply`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
        '504':
          description: The model did not answer in time (`model_timeout`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
  /oracle/ping:
    get:
      summary: Is the Oracle route on, and is the token right?
      description: >-
        For the bot's `doctor` and `health` checks. It does not call the model.
      security:
      - OracleBearer: []
      responses:
        '200':
          description: The route is on and the token is accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '401':
          description: Missing or wrong token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleError'
  /oracle/decisions:
    get:
      summary: The journal of the Oracle
      description: >-
        Every question the bot asked and what the model answered (or why it
        did not), newest first. In shadow mode, when the bot ignores the
        verdicts, this is the whole result. The journal belongs to the system,
        not to a user. The request bodies are left out of the list.
      parameters:
      - $ref: '#/components/parameters/UserId'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: before_id
        in: query
        description: The `next_before_id` of the previous page; 0 or absent starts at the newest.
        schema:
          type: integer
          format: int64
          minimum: 0
      - name: symbol
        in: query
        description: Only this symbol (upper case).
        schema:
          type: string
      responses:
        '200':
          description: A page of the journal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OracleDecisionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    OracleBearer:
      type: http
      scheme: bearer
      description: The value of `ORACLE_TOKEN` (at least 32 characters). Only the trading bot has it.
  parameters:
    UserId:
      name: X-User-ID
      in: header
      required: true
      description: >-
        The user. A missing header is 401; a value that is not a UUID is 400.
      schema:
        type: string
        format: uuid
    MemoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProposalId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    UserFileName:
      name: name
      in: path
      required: true
      description: >-
        A plain file name, percent-encoded: letters of any alphabet, digits,
        spaces, `-`, `_`, `.` and brackets, at most 100 characters, with one of
        the extensions `.txt .md .csv .json .yaml .yml .log`.
      schema:
        type: string
  responses:
    BadRequest:
      description: Bad request (a malformed id or body, or a value out of range)
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: The `X-User-ID` header is missing
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: >-
        There is no such item for this user. The same answer is given for an id
        that belongs to someone else.
      content:
        text/plain:
          schema:
            type: string
    MethodNotAllowed:
      description: Method not allowed
    PayloadTooLarge:
      description: The request body is larger than 1 MiB
      content:
        text/plain:
          schema:
            type: string
    InternalError:
      description: Internal server error (the cause is in the server log)
  schemas:
    OracleRequest:
      type: object
      required: [schema_version, signal]
      properties:
        schema_version:
          type: integer
          enum: [1]
        mode:
          type: string
          enum: ['', shadow, active]
          description: >-
            What the bot does with the verdict. Kept in the journal and used as
            the `mode` label of the metrics; the model is not told, and the
            verdict of a signal is the same in both modes (see the route).
        signal:
          $ref: '#/components/schemas/OracleSignal'
        rationale:
          type: string
          description: Why the strategy produced the signal.
        technicals:
          type: object
          additionalProperties: true
          description: Indicators of the last closed bar; shown to the model as they come, sorted by name.
        recent_bars:
          type: array
          description: The latest closed bars, oldest first (the newest 24 are kept).
          items:
            type: object
            additionalProperties: true
        volume_ratio:
          description: Volume of the last bar against its norm.
          oneOf:
          - type: number
          - type: string
        live_price:
          oneOf:
          - type: number
          - type: string
        context:
          type: object
          additionalProperties: true
          description: The account and the risk limits.
        news:
          type: array
          description: Newest first; at most 5 are kept.
          items:
            $ref: '#/components/schemas/OracleNewsItem'
    OracleSignal:
      type: object
      required: [signal_id, symbol, direction]
      properties:
        signal_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,128}$'
        symbol:
          type: string
          pattern: '^[A-Z0-9][A-Z0-9./-]{0,14}$'
        direction:
          type: string
          enum: [LONG, SHORT, FLAT]
        timeframe:
          type: string
        version:
          type: string
        closed_bar_timestamp:
          type: string
        expires_at:
          type: string
        confidence:
          type: number
    OracleNewsItem:
      type: object
      description: >-
        One article, already cleaned by the bot; it is cleaned and cut again
        here (headline 160 characters, summary 300, one line, no addresses or
        markup).
      properties:
        article_id:
          description: For the journal; the model does not see it.
        published_at:
          type: string
        source:
          type: string
        headline:
          type: string
        summary:
          type: string
        other_symbols:
          type: integer
          minimum: 0
          description: How many other stocks the article names.
    OracleResult:
      type: object
      required: [verdict, reason, request_id, model, cached, latency_ms]
      properties:
        verdict:
          type: string
          enum: [APPROVE, VETO, HOLD]
        reason:
          type: string
          description: One short sentence in Bulgarian (at most 200 characters).
        request_id:
          type: string
          description: The `X-Request-ID` of this call, to find it in the log.
        model:
          type: string
        cached:
          type: boolean
          description: The verdict was given a moment ago for the same signal.
        latency_ms:
          type: integer
          format: int64
          description: 0 for a cached verdict.
        prompt_version:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: >-
            A label of the question the model was asked: the first 12 hex characters
            of a SHA-256 over the system prompt as rendered, the JSON schema of the
            answer, the call settings of the Oracle (temperature, token limit, number
            of attempts, limit on the reason) and the layout of the facts. A change to
            any of them gives the next answers a new label, which is how a changed
            prompt is told apart afterwards (the bot's evaluation starts a new period
            then). For a cached verdict it is the label of the call that produced it.
            Not part of the label: the model (the `model` field), the model server's
            own settings (context size, default sampling) and anything the LLM client
            adds around the request. Additive: it is absent from the six required
            fields, so a client that does not know it keeps working.
    OracleError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [unauthorized, invalid_request, unreadable_body, body_too_large, method_not_allowed, model_unavailable, model_timeout, unusable_reply, internal_error]
        detail:
          type: string
          description: Only on `invalid_request`.
    OracleEvaluation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        request_id:
          type: string
        signal_id:
          type: string
        symbol:
          type: string
        mode:
          type: string
        status:
          type: string
          enum: [answered, failed]
        verdict:
          type: string
          enum: [APPROVE, VETO, HOLD]
          description: Absent when the status is `failed`.
        reason:
          type: string
        model:
          type: string
        attempts:
          type: integer
          description: >-
            How many times the model was asked (1 or 2); 0 on a row that did not
            reach the model (`served_from`).
        finish_reason:
          type: string
          description: '`length` means the reply was cut off at the token limit.'
        prompt_tokens:
          type: integer
        completion_tokens:
          type: integer
        latency_ms:
          type: integer
        error:
          type: string
          description: Only when the status is `failed`.
        prompt_version:
          type: string
          pattern: '^[0-9a-f]{12}$'
          description: >-
            The label of the question the model was asked (see `OracleResult`);
            also set on a failed row, with the question it would have asked.
            Absent when it was not recorded: the rows from before it existed
            (migration 00026), and a call that failed before the prompt was rendered.
        signal_version:
          type: string
          description: >-
            The version of the strategy that made the signal, as the bot sent it
            (`signal.version` of the request body). `oracle-probe` marks the bot's
            own test questions, which are not signals. Read from the stored request
            by the database; absent when the request did not say.
        served_from:
          type: string
          enum: [cache, joined]
          description: >-
            Present on the light row of a call that did not reach the model:
            `cache` (the verdict was given a moment ago for the same signal) or
            `joined` (the call waited for the one that was on its way). The
            verdict, reason, model and `prompt_version` are those of the answer it
            repeats; `mode` is the mode of THIS call; attempts, tokens and latency
            are 0; `request_id` and the stored request are this call's. At most one
            such row exists for a signal and a mode, and none when the mode already
            has a row of a call that reached the model. Absent on a row the model
            was asked for.
    OracleDecisionList:
      type: object
      properties:
        decisions:
          type: array
          items:
            $ref: '#/components/schemas/OracleEvaluation'
        next_before_id:
          type: integer
          format: int64
          description: The `before_id` of the next page; 0 when this was the last one.
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        session_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        sources:
          type: array
          description: >-
            Only on answers that used documents or memories: what they were
            based on, as it was shown while streaming.
          items:
            $ref: '#/components/schemas/SourceInfo'
        remembered:
          type: array
          description: >-
            Only on an answer planned from the person's memories that used some
            of them: the start of each memory it used (the same list as the
            `event: plan` frame of the stream).
          items:
            type: string
    SourceInfo:
      type: object
      properties:
        chunk_id:
          type: string
          format: uuid
        file_name:
          type: string
        page_number:
          type: integer
        content_snippet:
          type: string
        score:
          type: number
          format: double
          description: >-
            Measured as `score_type` says; 0 when there is no `score_type`. For
            `distance` it is the cosine distance between the question and the
            source - smaller is closer, and the summaries that are close enough to
            be used are at 0.10-0.17. It is not a percentage: with the embedding
            model in use even unrelated texts are at 0.15-0.30.
        score_type:
          type: string
          description: >-
            How `score` is measured. `distance` for a book summary or passage;
            `rrf` (0-100) only on answers stored long ago; absent on a recalled
            memory and on a passage the model found with a tool, which have no
            measure.
          enum: [rrf, distance]
        source_type:
          type: string
          enum: [text, ocr, concept, memory]
    Memory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        content:
          type: string
        status:
          type: string
          enum: [candidate, active]
        source_message_id:
          type: string
          format: uuid
          nullable: true
        importance:
          type: integer
          minimum: 1
          maximum: 10
        metadata:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
    FileCategory:
      type: string
      enum:
        - medicine
        - economics
        - programming
        - law
        - psychology
        - literature
        - philosophy
        - self_help
        - history
        - general
    IngestedFile:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
          format: int64
        status:
          type: string
          description: State of the ingest job.
          enum: [pending, processing, completed, failed]
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        category:
          $ref: '#/components/schemas/FileCategory'
        manual_override:
          type: boolean
          description: True when the category was set by the user, not chosen automatically.
        chunk_count:
          type: integer
          format: int64
          description: >-
            Number of embedded chunks stored for this file. Embeddings live in
            the document_chunks table (pgvector), not in an external vector
            store.
        has_embeddings:
          type: boolean
          description: True when at least one embedded chunk exists for the file.
        embedding_status:
          type: string
          description: >-
            Ingest status extended with the embedding state. `completed` means
            the file finished ingesting and has vectors, `empty` means it
            finished ingesting but produced no chunks, and `pending`,
            `processing` and `failed` mirror the ingest status.
          enum:
            - pending
            - processing
            - completed
            - failed
            - empty
    UserFileList:
      type: object
      required: [files, total_bytes, max_files, max_file_bytes, max_total_bytes]
      properties:
        files:
          type: array
          description: By name; `[]` when there are none.
          items:
            $ref: '#/components/schemas/UserFileInfo'
        total_bytes:
          type: integer
          format: int64
          description: What the files and their previous versions take.
        max_files:
          type: integer
        max_file_bytes:
          type: integer
        max_total_bytes:
          type: integer
          format: int64
    UserFileInfo:
      type: object
      required: [name, size, modified]
      properties:
        name:
          type: string
        size:
          type: integer
          format: int64
          description: Bytes.
        modified:
          type: string
          format: date-time
    LibraryAddResult:
      type: object
      required: [file_id, file_name, duplicate, size]
      properties:
        file_id:
          type: string
          format: uuid
        file_name:
          type: string
        duplicate:
          type: boolean
          description: The library had the same text already; nothing was added.
        size:
          type: integer
          format: int64
    UserFile:
      type: object
      required: [name, version, content]
      properties:
        name:
          type: string
        version:
          type: string
          enum: [current, previous]
        content:
          type: string
          description: The whole text (UTF-8; a byte order mark is dropped).
        size:
          type: integer
          format: int64
          description: Only for the current version.
        modified:
          type: string
          format: date-time
          description: Only for the current version.
    ChatAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        bytes:
          type: integer
        lines:
          type: integer
        tokens:
          type: integer
          description: An estimate for code (3 bytes a token), on the safe side.
        version:
          type: integer
          minimum: 1
          description: Grows each time the name is attached again with other content.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created:
          type: boolean
          description: Only in the answer to an upload - a name that was not attached before.
        replaced:
          type: boolean
          description: Only in the answer to an upload - the name was attached before with other content.
        unchanged:
          type: boolean
          description: Only in the answer to an upload - the same content again.
    Proposal:
      type: object
      description: >-
        Something the model asked to save, waiting for the user. A rule
        (`save_global_rule`) and a note on how to talk with the user
        (`save_style_note`) have `key` and `value`. The `create_memory` kind,
        with `content` and `importance`, is what proposals made before the owner
        decided that memories are saved at once look like; none is created now,
        but a stored one can still be approved or rejected. A write to one of
        the user's own text files (`write_file`, only when the file tools are
        turned on) has `file_name`, `file_mode` and the text in `content`: the
        model asks for it when it would replace a file that exists, or when the
        turn had read text from outside (see `external_sources`).
      properties:
        id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [save_global_rule, save_style_note, create_memory, write_file]
        status:
          type: string
          enum: [pending, approved, rejected]
        session_id:
          type: string
        summary:
          type: string
          description: One line, ready to show to the user (in Bulgarian).
        key:
          type: string
          description: Rules and notes only (at most 64 characters).
        value:
          type: string
          description: Rules and notes only (at most 400 characters).
        content:
          type: string
          description: >-
            Memories (at most 1000 characters) and file writes (the text to
            write or to add, at most 65 536 bytes).
        importance:
          type: integer
          minimum: 1
          maximum: 10
          description: Memories only.
        file_name:
          type: string
          description: File writes only - a plain name in the user's folder, such as `list.txt`.
        file_mode:
          type: string
          enum: [create, replace, append]
          description: >-
            File writes only. `create` makes a new file, `replace` puts the text
            in place of a file that exists (the old text is kept as the previous
            version), `append` adds it to the end.
        source:
          type: string
          description: >-
            A whole page the server saved (the tool `save_page`): the address it
            came from. `content` is then only the start of the page, with what is
            left said at its end; the approval writes all of it.
        external_sources:
          type: array
          description: >-
            The tools whose results (web pages, documents) were read in the turn
            that made the proposal. The text may have come from there, so the
            user should check it; empty means only the conversation.
          items:
            type: string
        created_at:
          type: string
          format: date-time
    Rule:
      type: object
      properties:
        id:
          type: integer
        kind:
          type: string
          enum: [rule, style]
          description: >-
            `rule` is an instruction of the user (at most 20), `style` a note on
            how he likes to be talked to (at most 8); the prompt shows each in
            its own section. A rule and a note may share a key.
        key:
          type: string
        value:
          type: string
        enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
    TelegramSession:
      type: object
      required:
      - session_id
      - name
      properties:
        session_id:
          type: string
          description: The session the bot writes to, `tg-<chat id>`.
          example: tg-1607252727
        name:
          type: string
          description: What the app calls the conversation (`Telegram`, `Telegram 2`, ...).
          example: Telegram
    TaskPlanResponse:
      type: object
      required:
      - plan
      properties:
        plan:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TaskPlan'
    TaskPlan:
      type: object
      required: [id, goal, steps, status]
      properties:
        id:
          type: integer
          format: int64
        goal:
          type: string
        status:
          type: string
          enum: [active, done, cancelled]
          description: '`done`: no step is left to do. `cancelled`: another plan took its place, or the person stopped it.'
        kind:
          type: string
          enum: [key_facts, summary, full]
          description: >-
            Missing for a plan of the assistant. Set for a plan the server walks itself: what it
            makes of each document (a file with its key facts, with a summary, or - `full` - with
            detailed notes of the whole text, read part by part and added to the file after each).
        steps:
          type: array
          items:
            $ref: '#/components/schemas/TaskPlanStep'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    TaskPlanStep:
      type: object
      required: [id, text, status]
      properties:
        id:
          type: integer
          description: The number of the step, from 1.
        text:
          type: string
        tool:
          type: string
          enum: [web_search, web_fetch, add_to_library, list_documents, search_documents, read_attachment, read_file, write_file, none]
          description: >-
            The tool that does the step. A step that names one is `done` only after a successful
            call of it (a write may be a `write_file` or an `append_file`) that no other step has
            used. `none` is a step that needs no tool (a decision, the answer to the user) and is
            done on the word of the assistant. A step that names nothing at all is `done` after
            some successful call of any tool that no other step has used.
        status:
          type: string
          enum: [pending, doing, done, failed, skipped]
        evidence:
          type: string
          description: >-
            What the tool did, for a step that was done with one, for example
            `web_fetch https://example.org/paper -> 1.3 KB (short: a summary?)`.
        note:
          type: string
          description: The reason of a failed or skipped step.
        ref:
          type: string
          format: uuid
          description: In a plan the server walks, the document of the library the step works on.
        parts:
          type: integer
          description: >-
            A plan of the kind `full`: the document is read whole, in this many parts of about
            10 000 characters. Missing for every other step.
        parts_done:
          type: integer
          description: 'A plan of the kind `full` - how many parts are read and written.'
        file:
          type: string
          description: 'A plan of the kind `full` - the file the notes of the next part go to.'
    TelegramSessionList:
      type: object
      required:
      - sessions
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TelegramSession'
