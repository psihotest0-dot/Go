# Alert rules for the backend. Prometheus evaluates them and shows the state at
# http://127.0.0.1:9090/alerts (and Grafana lists them under Alerting, from its
# Prometheus data source). There is no Alertmanager in this setup, so NOTHING IS
# SENT anywhere: an alert is something to look at, not a notification. To get a
# message, add an Alertmanager (or Grafana contact points) later.
#
# The metrics come from the backend (/metrics); the dashboard in
# grafana/dashboards/main.json shows the same series. The last group watches the
# trading bot (grafana/dashboards/alpaca-trader.json is its dashboard).
groups:
  - name: backend
    rules:
      - alert: BackendDown
        expr: up{job="go-monolith"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The backend does not answer /metrics"
          description: "Prometheus has not been able to scrape host.docker.internal:8080 for 2 minutes: the backend is stopped, or listens on another address (LISTEN_ADDR)."

      - alert: ServerErrors
        expr: |
          sum(rate(api_requests_total{status=~"5.."}[5m])) / sum(rate(api_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of the requests end with a server error"
          description: "Look at app.log: the LLM, the embedder or the database may be down."

      - alert: StateMetricsUnavailable
        expr: state_collector_up == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The job queue and file panels cannot read the database"
          description: "The backend could not run its queue queries for 5 minutes (see 'metrics: failed to read' in app.log)."

  - name: ingest
    rules:
      - alert: IngestAttemptsFailing
        expr: sum(increase(ingest_jobs_total{result="failed"}[30m])) >= 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "File ingest keeps failing"
          description: "3 or more ingest attempts failed in 30 minutes (River retries them). Usual causes: the embedder is down, or the database is unreachable."

      - alert: FilesInFailedState
        expr: ingested_files{status="failed"} > 0
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "{{ $value }} uploaded file(s) failed to ingest"
          description: "A failed file stays failed until it is uploaded again or re-run with `go run ./cmd/reingest -file <id>`."

      - alert: IngestQueueStuck
        expr: max(river_oldest_available_job_age_seconds{kind="ingest_file"}) > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "An uploaded file has waited more than 15 minutes for its turn"
          description: "A job is ready but not started: the workers are busy with long files (OCR), or not running."

      - alert: OtherJobsStuck
        expr: max by (kind) (river_oldest_available_job_age_seconds{kind!~"distillation_worker|ingest_file"}) > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A background job has waited more than 30 minutes ({{ $labels.kind }})"
          description: "Distillation is left out on purpose: it works through a queue for days."

  - name: performance
    rules:
      - alert: ChatSearchSlow
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(stage_duration_seconds_bucket{stage="search_for_context"}[10m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "The search of a chat turn takes more than 1 s (p95)"
          description: "The target is a few hundred milliseconds at most. Check the embedder (CPU busy with OCR?) and the database indexes."

      - alert: ChatWaitsForTheLLM
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(llm_queue_wait_seconds_bucket{priority="interactive"}[10m]))) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "A chat turn waits more than 30 s for a free model slot (p95)"
          description: "Background work (summaries, distillation) or another client is using the slots."

  - name: paid-services
    rules:
      - alert: WebToolsUsedALot
        expr: sum(increase(agent_web_tool_requests_total{result="ok"}[1d])) > 500
        labels:
          severity: info
        annotations:
          summary: "More than 500 paid web searches/fetches in the last day"
          description: "About $0.75 per 1000 requests; a loop in the model's tool calls would show up here first."

  - name: oracle
    rules:
      - alert: OracleGivesNoVerdict
        expr: sum(increase(oracle_requests_total{outcome="failed"}[30m])) >= 2
        labels:
          severity: warning
        annotations:
          summary: "The Oracle could not give a verdict (2 or more calls in 30 minutes)"
          description: "Calls of the trading bot ended without a verdict: the model server is down or still loading, or its replies are unusable (see 'oracle evaluation failed' in backend.log). The bot reads each of them as HOLD: in shadow mode nothing is lost but the journal; once the Oracle is switched to active, no trade is made."

      - alert: OracleCallsRefused
        expr: sum by (outcome) (increase(oracle_requests_total{outcome=~"unauthorized|bad_request"}[15m])) > 0
        labels:
          severity: warning
        annotations:
          summary: "The Oracle refuses calls ({{ $labels.outcome }})"
          description: "unauthorized: a call with a wrong or missing token (the bot's ORACLE_BACKEND_TOKEN does not match ORACLE_TOKEN here, or something else on this machine is calling the route). bad_request: a body this side cannot use (the bot and the backend disagree about the contract; see 'oracle: invalid request' in backend.log). The bot reads a refused call as HOLD."

      - alert: OracleSlow
        expr: sum(rate(oracle_latency_seconds_sum[30m])) / sum(rate(oracle_latency_seconds_count[30m])) > 8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "An Oracle call takes more than 8 s on average"
          description: "The usual is 1.5 to 2.5 s. The bot gives up after about 10 s (the backend finishes the work and the next question finds the answer in the cache), but a slow model means busy model slots (chat, distillation) or a busy GPU. See ChatWaitsForTheLLM."

  # The trading bot (another project; job alpaca-trader, series alpaca_*). Written by
  # its session, merged here. Its Oracle calls are watched by the 'oracle' group above.
  - name: alpaca-trader
    rules:
      # The container is stopped or restarting, Docker Desktop is not running, or the metrics are
      # switched off (METRICS_ENABLED). The bot runs around the clock (it waits when the market is
      # closed), so a target that is down is not a normal state, also at night and on Sundays.
      - alert: AlpacaTargetDown
        expr: up{job="alpaca-trader"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The bot's /metrics at {{ $labels.instance }} does not answer"
          description: "Prometheus has not reached {{ $labels.instance }} for 5 minutes (:9101 is the trading loop, :9102 the Oracle observer). Check `docker ps` (alpaca-trader, alpaca-trader-observe) and that Docker Desktop is running. A restart of the container shows here for a minute and is no reason to worry."

      # The process answers /metrics but its loop has stopped ticking. The loop beats at least every
      # 5 minutes (every minute while the market is open), so 15 minutes is three missed beats.
      - alert: AlpacaLoopStalled
        expr: time() - alpaca_heartbeat_timestamp_seconds > 900
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The bot's loop at {{ $labels.instance }} has not ticked for {{ $value | humanizeDuration }}"
          description: "The process still answers /metrics but its loop is stuck (a call that never returns?). `docker compose logs --tail 50 trader` (or observe) shows the last line. The Docker healthcheck says the same thing in `docker ps` as `unhealthy`."

      # The market is open and no look for entries has finished for 25 minutes (one is due every 15
      # minutes, with a few retries), counted from the later of the last look and the moment this
      # stretch of open market began, as the Docker healthcheck does. Without the second, it would
      # fire every morning (Friday's last look) and for minutes after every restart (a restarted
      # process has no look yet: its gauge is 0). `A > on(...) B or on(...) B` is "the larger of the two".
      # (The time difference is on the left of `and` so that $value is the number of seconds.)
      - alert: AlpacaNoEntryLookups
        expr: |
          time() - (
              alpaca_last_entries_timestamp_seconds > on (instance, job) alpaca_market_open_since_timestamp_seconds
            or on (instance, job)
              alpaca_market_open_since_timestamp_seconds
          ) > 1500
          and
          alpaca_market_open == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "No look for entries at {{ $labels.instance }} for {{ $value | humanizeDuration }} with the market open"
          description: "The loop ticks but does not get to the entry look-up: the bar never arrives from Alpaca (data problem), or every look crashes. See `docker compose logs --tail 80 trader` and the `bar not available yet` / `Failed to load market data` lines."

      # A signal that broke in risk or execution (no order was placed, and the cause is a bug), or a
      # whole look that crashed. The bot also logs a CRITICAL line starting with `ALERT:` and writes
      # the alert to its journal (audit_events).
      - alert: AlpacaSignalsBroke
        expr: increase(alpaca_entries_errors_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Signals broke before they became orders at {{ $labels.instance }}"
          description: "At least one signal failed in risk or execution (or a look for entries crashed) in the last 15 minutes. `docker compose logs trader | grep ALERT` and `docker compose exec trader python -m trading_system report` show which."

      # A position without an active protective stop (stop-loss). The bot halts its own entries the
      # moment it sees one and logs a CRITICAL line; it closes nothing by itself unless
      # EMERGENCY_CLOSE_UNPROTECTED is on (it is not).
      #
      # The next three rules are about the TRADING LOOP only (service="trader", a target label in the
      # backend's prometheus.yml). The observer exports the same gauges, but nothing ever sets them
      # there, so they sit at 0 for good: a timestamp of 0 would look infinitely stale. On the trader
      # a gauge that was never set is 0 as well, which is wanted here: a protection check or a
      # reconciliation that has NEVER succeeded since the start (keys rejected, broker unreachable)
      # fires these rules too, after the `for`.
      - alert: AlpacaUnprotectedPositions
        expr: alpaca_unprotected_positions{service="trader"} > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} open position(s) without a protective stop"
          description: "The bot found a position that no stop covers and has halted new entries. Look at the account (`docker compose exec trader python -m trading_system reconcile`), fix it by hand at Alpaca, then `resume-entries`. The paper account is shared with other tools, so the position may not be the bot's."

      # `alpaca_unprotected_positions == 0` means "all protected" only while the check keeps running;
      # a check that cannot read the broker leaves the number (and this time) as they were.
      - alert: AlpacaProtectionCheckStale
        expr: time() - alpaca_protection_check_timestamp_seconds{service="trader"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The check for unprotected positions has not succeeded for {{ $value | humanizeDuration }}"
          description: "The loop ticks but cannot read the account (Alpaca down, keys rejected, or the connection is cut), so `alpaca_unprotected_positions` is not to be trusted. `docker compose logs --tail 80 trader | grep -i 'emergency check\\|Failed'`."

      # The orders in the database are brought up to date from the broker on every tick. No success
      # for 15 minutes: the broker cannot be read, or some orders cannot be refreshed.
      - alert: AlpacaReconcileStale
        expr: time() - alpaca_reconcile_timestamp_seconds{service="trader"} > 900
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "The orders have not been reconciled with the broker for {{ $value | humanizeDuration }}"
          description: "Orders in the database may differ from the broker's. `docker compose logs --tail 80 trader | grep -i 'Could not refresh\\|Housekeeping step failed'`, then `docker compose exec trader python -m trading_system reconcile`."

      # The candidates the observer runs forward in time (research plan, section 12.1). A pass in which
      # one could not be run is a gap in the record, and the record is the point.
      - alert: AlpacaCandidatePassBroke
        expr: increase(alpaca_candidate_errors_total[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "A strategy candidate could not be run on a bar"
          description: "The observer journals the candidates' signals for the forward test; a pass in which one broke leaves a hole in it. `docker compose logs observe | grep -i candidate` shows the error."
