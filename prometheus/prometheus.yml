global:
  scrape_interval: 15s
  # Alert rules are evaluated on the same cadence.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'go-monolith'
    static_configs:
      # The backend runs on the host (127.0.0.1:8080), outside compose.
      - targets: ['host.docker.internal:8080']

  # The trading bot (C:\alpaca-roundtable-trader) is another project with its
  # own compose; it does not join this network. Its containers publish /metrics
  # on the host loopback only, and this job scrapes them the same way as the
  # backend above: 9101 = trader, 9102 = observer. Every series of the bot has
  # the prefix alpaca_, so none can collide with ours. The rules are the group
  # alpaca-trader in alerts.yml (a target that stays down for 5 minutes shows as
  # AlpacaTargetDown there; nothing is sent), the dashboard is
  # grafana/dashboards/alpaca-trader.json.
  - job_name: 'alpaca-trader'
    scrape_interval: 15s
    static_configs:
      - targets:
          - 'host.docker.internal:9101'
          - 'host.docker.internal:9102'
