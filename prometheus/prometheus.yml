global:
  scrape_interval: 15s
  # Alert rules are evaluated on the same cadence.
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'go-monolith'
    static_configs:
      # The backend runs on the host (127.0.0.1:8080), outside compose.
      - targets: ['host.docker.internal:8080']
