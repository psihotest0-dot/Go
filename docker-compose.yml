# Every service (here and in docker-compose.override.yml) has `restart: unless-stopped`: after a
# reboot or a crash of the Docker engine the containers that were running come back by
# themselves; one stopped by hand (`docker compose stop` / `down`) stays stopped. Docker Desktop
# itself must start with Windows (Settings > General > "Start Docker Desktop when you sign in").
# The backend is NOT a container: main.exe runs on the host and nothing here starts it.
#
# Memory ceilings (`mem_limit`, here and in docker-compose.override.yml). The Docker VM is capped at
# 6 GB (C:\Users\<user>\.wslconfig, memory=6GB); the containers use ~2.4 GB together. Each ceiling
# sits above the peak measured on 2026-11-08 (cgroup memory.peak, which includes reclaimable page
# cache), so a runaway container is killed and restarted by `restart: unless-stopped` instead of
# starving the others. `memswap_limit` equals `mem_limit` so the container cannot spill into swap
# and thrash the whole VM. They are ceilings, not reservations: the sum may exceed the VM size.
# If a service is OOM-killed (`docker inspect -f '{{.State.OOMKilled}}' <name>`), raise its limit.
services:
  embedder:
    build:
      context: ./services/embedder
      dockerfile: Dockerfile
    restart: unless-stopped
    mem_limit: 2g          # steady 0.9-1.1 GB, peak 1.5 GB (model load)
    memswap_limit: 2g
    ports:
      # Published on the loopback interface only: the host backend is the only client.
      - "127.0.0.1:8000:8000"
    # CPU only: no GPU is requested here, and the image has no CUDA libraries.
    # (A `deploy.resources.reservations.cpus` used to stand here; a reservation
    # limits nothing outside Swarm. A real cap would be `cpus:` on the service, but
    # the embedder needs every core it can get while a library is being ingested.)
    environment:
      - CUDA_VISIBLE_DEVICES=-1

  prometheus:
    image: prom/prometheus:v3.15.0
    restart: unless-stopped
    mem_limit: 1g          # steady ~50 MB
    memswap_limit: 1g
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      # The time series (the image keeps them in /prometheus). A named volume,
      # so they survive `docker compose down` and are easy to find; without this
      # line Docker makes an anonymous volume with a hash for a name.
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      # The backend runs on the host, not in compose (prometheus/prometheus.yml
      # scrapes host.docker.internal:8080). Docker Desktop defines the name
      # itself; the mapping makes it work on Linux hosts too.
      - "host.docker.internal:host-gateway"

  # Sends the alerts of prometheus/alerts.yml to Telegram (alertmanager/alertmanager.yml). The token and
  # the chat id are read from alertmanager/secrets/, which git ignores: create them once with
  # scripts/alertmanager-secrets.ps1. Without those files only this service fails; the rest is unaffected.
  alertmanager:
    image: prom/alertmanager:v0.34.2
    restart: unless-stopped
    mem_limit: 256m        # steady ~20 MB
    memswap_limit: 256m
    volumes:
      - ./alertmanager:/etc/alertmanager:ro
      # Silences and the log of what was sent survive a restart (otherwise every
      # firing alert would be announced again).
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:13.2.3
    restart: unless-stopped
    mem_limit: 1536m       # steady ~430 MB, peak 1.1 GB at start (provisioning)
    memswap_limit: 1536m
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      # Set GRAFANA_ADMIN_PASSWORD in .env (see .env.example). Grafana only reads
      # this when it creates its database, i.e. on a fresh container.
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}

volumes:
  alertmanager_data:
    name: go_alertmanager_data
  prometheus_data:
    # Explicit name, like pgdata in docker-compose.override.yml: it must not
    # depend on the folder name. `docker compose down -v` deletes it, plain
    # `down` does not. Retention is the Prometheus default (15 days).
    name: go_prometheus_data
