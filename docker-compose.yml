services:
  embedder:
    build:
      context: ./services/embedder
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=-1
    deploy:
      resources:
        reservations:
          # Ensure it doesn't request GPU
          # (Docker compose will not allocate GPU by default unless explicitly requested,
          # but we can enforce CPU-only if we don't declare any gpu capabilities)
          # We just omit GPUs here.
          cpus: '0.1'

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
