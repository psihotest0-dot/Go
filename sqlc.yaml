version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/query.sql"
    schema: "migrations"
    gen:
      go:
        package: "db"
        out: "internal/db"
        emit_json_tags: true
        overrides:
          - db_type: "vector"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
          - column: "memories.embedding"
            go_type:
              import: "github.com/pgvector/pgvector-go"
              package: "pgvector"
              type: "Vector"
          - column: "combined_results.memory_id"
            go_type: "github.com/google/uuid.NullUUID"
          - column: "combined_results.chunk_id"
            go_type: "github.com/google/uuid.NullUUID"
