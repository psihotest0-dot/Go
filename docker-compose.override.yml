services:
  db:
    image: ankane/pgvector:v0.5.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=postgres
    volumes:
      # A named volume: the data survives recreating the container. (Without it
      # Docker makes a new anonymous volume per container and the old one is
      # orphaned.)
      - pgdata:/var/lib/postgresql/data
    # `docker compose ps` / `up --wait` report the database as healthy only when it
    # accepts connections. (The embedder has its own HEALTHCHECK in its Dockerfile.)
    # Nothing in this file depends on either: the backend runs on the host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Docker's default /dev/shm is 64 MB, too little for parallel queries with
    # work_mem = 32MB; they fail with "could not resize shared memory segment".
    shm_size: 1gb
    # Sized for a 16-thread / 32 GB host with ~15 GB given to the Docker VM.
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - work_mem=32MB
      - -c
      - maintenance_work_mem=1GB
      - -c
      - effective_cache_size=8GB
      - -c
      - max_parallel_workers_per_gather=4

  # The database archive OUTSIDE Docker, the way the trading bot does it. Every
  # DB_BACKUP_INTERVAL_SECONDS (default 6 h, the first round at start) it writes a checked dump
  # to ${BACKUP_DIR}/auto (a quick one without embedding_cache, plus a full one about once a
  # day) and copies storage/ (the uploaded originals) additively to ${BACKUP_DIR}/storage.
  # Set BACKUP_DIR in .env to a folder OUTSIDE the repository and outside OneDrive (default:
  # ./backups). If a round fails the log says "Backup FAILED" (`docker compose logs backup`)
  # and it tries again in 10 minutes; `docker ps` shows the service unhealthy when no
  # quick dump is newer than one interval + 1 h. It does not replace scripts/backup-task.ps1
  # (the daily Windows task): the two use different folders and never prune each other.
  # What the script does, step by step: scripts/db-backup-loop.sh.
  backup:
    image: ankane/pgvector:v0.5.1   # the same image as db: its pg_dump always matches the server
    restart: unless-stopped
    init: true                      # `docker stop` reaches the script at once, not after 10 s
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["sh", "/usr/local/bin/db-backup-loop.sh"]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: postgres          # the same development password as the db service above
      PGDATABASE: postgres
      TZ: ${TZ:-UTC}                # the time zone of the file names and the log
      DB_BACKUP_INTERVAL_SECONDS: ${DB_BACKUP_INTERVAL_SECONDS:-21600}
      DB_BACKUP_KEEP: ${DB_BACKUP_KEEP:-12}
      DB_BACKUP_KEEP_FULL: ${DB_BACKUP_KEEP_FULL:-7}
    volumes:
      - ./scripts/db-backup-loop.sh:/usr/local/bin/db-backup-loop.sh:ro
      - ./storage:/storage:ro
      - ${BACKUP_DIR:-./backups}:/backups
    healthcheck:
      test:
        - CMD-SHELL
        - find /backups/auto -maxdepth 1 -name '*_nocache.dump' -mmin -$$(( $$DB_BACKUP_INTERVAL_SECONDS / 60 + 60 )) | grep -q .
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 15m

volumes:
  pgdata:
    # Explicit name: the volume must not depend on the folder name, otherwise a
    # renamed or re-cloned checkout would silently start on an empty database.
    name: go_pgdata
